name: Deploy web app to GitHub Pages

# Builds web/ (Vite + React) and publishes it at https://itayinbarr.github.io/ozen/.
# spec/ is an input too: the build ships spec/mel_filters.bin and the unit tests
# check the engine against spec/segmenter-vectors.json and spec/golden/.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'spec/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # onnxruntime-node is only used by the opt-in golden test; skip optional GPU downloads.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The tokenizer tests run against the real vocabulary (700 KB, pinned + checksummed).
      - name: Fetch model tokenizer
        run: |
          d="$HOME/.cache/ozen/models/82aae03d"; mkdir -p "$d"
          curl -fsSL -o "$d/tokenizer.json" https://huggingface.co/itayinbar/Ozen-v1/resolve/82aae03decb5592029922ea15e19ed96d1e8ece3/tokenizer.json
          echo "050f0aff338e5779ebe80f25c760da76857e009dc17c2caef8424d613ee7dbfa  $d/tokenizer.json" | sha256sum -c -
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
