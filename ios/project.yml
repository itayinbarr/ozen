name: Ozen
options:
  bundleIdPrefix: com.itayinbar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: he

packages:
  # The inference package; another part of the repo, consumed by path.
  OzenCore:
    path: OzenCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal team "Itay Inbar". Do not change to another team.
    DEVELOPMENT_TEAM: "65MGR94YVU"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

targets:
  Ozen:
    type: application
    platform: iOS
    sources:
      - path: Ozen
        excludes:
          - "Model"
          - "Model/**"
          - "**/*.md"
          - "Resources/Fonts/**/OFL.txt"
      - path: Shared
      # Model files are fetched (pinned + checksummed) by the pre-build script
      # below and shipped flat under Model/ in the bundle. Gitignored.
      - path: Ozen/Model
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: OzenCore
        product: OzenCore
      - target: OzenLive
      - target: OzenShare
    preBuildScripts:
      - name: Fetch Ozen-v1 model
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/../tools/model/fetch-model.sh
          - $(SRCROOT)/../spec/mel_filters.bin
        outputFiles:
          - $(SRCROOT)/Ozen/Model/encoder_model_fp16.onnx
          - $(SRCROOT)/Ozen/Model/decoder_model_merged.onnx
          - $(SRCROOT)/Ozen/Model/tokenizer.json
          - $(SRCROOT)/Ozen/Model/mel_filters.bin
        script: |
          set -euo pipefail
          "$SRCROOT/../tools/model/fetch-model.sh" "$SRCROOT/Ozen/Model"
          cp "$SRCROOT/../spec/mel_filters.bin" "$SRCROOT/Ozen/Model/mel_filters.bin"
          touch "$SRCROOT/Ozen/Model/"*
    postBuildScripts:
      # onnxruntime.framework's Info.plist says MinimumOSVersion 15.1 while its binary is built for
      # a newer iOS; App Store processing rejects that mismatch (ITMS-90208). Make the plist agree
      # with the binary, then re-sign the framework.
      - name: Fix onnxruntime.framework MinimumOSVersion
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          fw="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/onnxruntime.framework"
          [ -d "$fw" ] || exit 0
          minos="$(xcrun vtool -show-build "$fw/onnxruntime" | awk '/minos/ {print $2; exit}')"
          [ -n "$minos" ] || { echo "error: could not read minos of onnxruntime"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion $minos" "$fw/Info.plist"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none --preserve-metadata=identifier,flags "$fw"
          fi
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Ozen
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.ozen
        INFOPLIST_FILE: Ozen/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ozen/Ozen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
    info:
      path: Ozen/Info.plist
      properties:
        CFBundleDisplayName: אוזן
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # On-device only: no network calls, no encryption beyond the OS.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "אוזן מקליטה כדי לתמלל — ההקלטה והתמלול נשארים במכשיר בלבד."
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIAppFonts:
          - Karantina-Regular.ttf
          - Karantina-Bold.ttf
          - Rubik-Light.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - public.mp3
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - com.apple.coreaudio-format
              - org.xiph.opus
              - org.xiph.ogg-audio
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.xiph.opus
            UTTypeDescription: Opus Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [opus]
              public.mime-type: [audio/opus]
          - UTTypeIdentifier: org.xiph.ogg-audio
            UTTypeDescription: Ogg Audio
            UTTypeConformsTo: [public.audio]
            UTTypeTagSpecification:
              public.filename-extension: [ogg, oga]
              public.mime-type: [audio/ogg]
    entitlements:
      path: Ozen/Ozen.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.itayinbar.ozen

  OzenLive:
    type: app-extension
    platform: iOS
    sources:
      - path: OzenLive
      - path: Shared
      - path: Ozen/Resources/Fonts
        buildPhase: resources
        excludes:
          - "**/OFL.txt"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: OzenLive
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.ozen.live
        INFOPLIST_FILE: OzenLive/Info.plist
        CODE_SIGN_ENTITLEMENTS: OzenLive/OzenLive.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: OzenLive/Info.plist
      properties:
        CFBundleDisplayName: אוזן
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Karantina-Regular.ttf
          - Karantina-Bold.ttf
          - Rubik-Light.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
    entitlements:
      path: OzenLive/OzenLive.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.itayinbar.ozen

  OzenShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OzenShare
      - path: Shared
      - path: Ozen/Resources/Fonts
        buildPhase: resources
        excludes:
          - "**/OFL.txt"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: OzenShare
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.ozen.share
        INFOPLIST_FILE: OzenShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: OzenShare/OzenShare.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: OzenShare/Info.plist
      properties:
        CFBundleDisplayName: אוזן
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Karantina-Bold.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One audio attachment, including WhatsApp voice notes (.opus).
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.xiph.opus"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "org.xiph.ogg-audio"
              ).@count == 1).@count == 1
    entitlements:
      path: OzenShare/OzenShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.itayinbar.ozen

  OzenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OzenTests
    dependencies:
      - target: Ozen
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.itayinbar.ozen.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ozen.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ozen
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Ozen:
    build:
      targets:
        Ozen: all
        OzenTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - OzenTests
    archive:
      config: Release
